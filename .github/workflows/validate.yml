name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: skills (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill structure and path hygiene
        run: python scripts/validate_skills.py

      - name: Check Python syntax of bundled scripts
        run: python -m compileall -q skills scripts

      - name: Verify no committed bytecode
        run: |
          if git ls-files | grep -q '__pycache__\|\.pyc$'; then
            echo "bytecode is committed; add it to .gitignore"
            exit 1
          fi
